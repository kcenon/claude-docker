# docker-compose.isolated.yml
# Generated by scripts/generate-compose — do not edit manually.
# Usage: docker compose -f docker-compose.yml -f docker-compose.isolated.yml up
#
# Each account mounts its own independent clone — separate working tree AND
# separate git metadata, created by scripts/setup-isolated.sh. Unlike a
# worktree, nothing is shared: there is no common object store to read other
# branches from or rewrite refs in.
#
# The volume lists carry !override so they REPLACE the base list. Compose
# merges volumes by container target, so without the tag the shared
# ${PROJECT_DIR} mount would survive alongside the clone (issue #335).
# Requires a Compose release that supports !override (Docker Compose v2.24.4+).
#
# Shared host-home mounts are absent by design: no read-only host config
# tree, no agents/skills tree, no shared gh config. An isolated account
# therefore has no shared hooks, skills, commands, statusline or CLAUDE.md.
#
# The container profile is hardened: read-only root filesystem, all
# capabilities dropped, no-new-privileges, an init process and a bounded
# PID limit. Every path the entrypoint writes to outside the account's own
# mounts is a bounded tmpfs; $HOME itself stays read-only, so the global
# git config is redirected into the per-account state mount.
#
# The environment lists carry !override for the same reason the volume
# lists do. An untagged block merges by key, so the base stack's shared
# GH_TOKEN would survive into every isolated service; Compose cannot
# remove a single inherited key, so the list is re-emitted in full and
# whatever is absent below is absent from the resolved service.
#
# Each account is on its own bridge network, so outbound access keeps
# working while siblings cannot resolve or connect to each other.
# Egress allowlisting is a separate proxy/firewall concern.

services:
  claude-a:
    working_dir: ${CONTAINER_ISOLATED_DIR_A:-/workspace-a}
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          pids: ${ISOLATED_PIDS_LIMIT:-1024}
    tmpfs:
      - /tmp:mode=1777
      - /home/node/.config:uid=${UID:-1000},gid=${GID:-1000},mode=0700
      - /home/node/.cache:uid=${UID:-1000},gid=${GID:-1000},mode=0700
      - /home/node/.npm:uid=${UID:-1000},gid=${GID:-1000},mode=0700
      - /home/node/.agents:uid=${UID:-1000},gid=${GID:-1000},mode=0700
    networks:
      - isolated_net_a
    environment: !override
      - TERM=xterm-256color
      - TZ=${TZ:-UTC}
      - HOME=/home/node
      - AGENT_RUNTIME=claude
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      - CLAUDE_CONFIG_SOURCE=${CLAUDE_CONFIG_SOURCE:-}
      - CLAUDE_NORMALIZE_CRLF=${CLAUDE_NORMALIZE_CRLF:-}
      - NODE_OPTIONS=--max-old-space-size=3072
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - GIT_CONFIG_GLOBAL=/home/node/.claude/gitconfig
    volumes: !override
      - ${ISOLATED_WORKSPACE_A}:${CONTAINER_ISOLATED_DIR_A:-/workspace-a}
      - ${HOME}/.claude-state/account-a:/home/node/.claude
      - node_modules_a:${CONTAINER_ISOLATED_DIR_A:-/workspace-a}/node_modules

  claude-b:
    working_dir: ${CONTAINER_ISOLATED_DIR_B:-/workspace-b}
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          pids: ${ISOLATED_PIDS_LIMIT:-1024}
    tmpfs:
      - /tmp:mode=1777
      - /home/node/.config:uid=${UID:-1000},gid=${GID:-1000},mode=0700
      - /home/node/.cache:uid=${UID:-1000},gid=${GID:-1000},mode=0700
      - /home/node/.npm:uid=${UID:-1000},gid=${GID:-1000},mode=0700
      - /home/node/.agents:uid=${UID:-1000},gid=${GID:-1000},mode=0700
    networks:
      - isolated_net_b
    environment: !override
      - TERM=xterm-256color
      - TZ=${TZ:-UTC}
      - HOME=/home/node
      - AGENT_RUNTIME=claude
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      - CLAUDE_CONFIG_SOURCE=${CLAUDE_CONFIG_SOURCE:-}
      - CLAUDE_NORMALIZE_CRLF=${CLAUDE_NORMALIZE_CRLF:-}
      - NODE_OPTIONS=--max-old-space-size=3072
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - GIT_CONFIG_GLOBAL=/home/node/.claude/gitconfig
    volumes: !override
      - ${ISOLATED_WORKSPACE_B}:${CONTAINER_ISOLATED_DIR_B:-/workspace-b}
      - ${HOME}/.claude-state/account-b:/home/node/.claude
      - node_modules_b:${CONTAINER_ISOLATED_DIR_B:-/workspace-b}/node_modules

networks:
  isolated_net_a:
    driver: bridge
  isolated_net_b:
    driver: bridge
