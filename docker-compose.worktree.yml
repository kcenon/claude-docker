# docker-compose.worktree.yml
# Generated by scripts/generate-compose — do not edit manually.
# Usage: docker compose -f docker-compose.yml -f docker-compose.worktree.yml up
#
# Every volume list below carries the !override merge tag, so it REPLACES the
# base list instead of extending it. Compose merges volumes by container
# target, and /project-<letter> is a different target from the base /project,
# so without the tag the shared ${PROJECT_DIR} mount survived alongside the
# worktree and stayed writable from inside the container (issue #335).
# Requires a Compose release that supports !override (Docker Compose v2.24.4+).
#
# Worktrees are a concurrency tier, not a security boundary: the accounts
# still share one git object store. See docs/ISOLATION.md.

services:
  claude-a:
    working_dir: ${CONTAINER_PROJECT_DIR_A:-/project-a}
    volumes: !override
      - ${PROJECT_DIR_A}:${CONTAINER_PROJECT_DIR_A:-/project-a}
      - ${HOME}/.claude-state/account-a:/home/node/.claude
      - ${HOME}/.claude:/home/node/.claude-host:ro
      - ${GH_CONFIG_DIR:-${HOME}/.config/gh}:/home/node/.config/gh:ro
      - node_modules_a:${CONTAINER_PROJECT_DIR_A:-/project-a}/node_modules

  claude-b:
    working_dir: ${CONTAINER_PROJECT_DIR_B:-/project-b}
    volumes: !override
      - ${PROJECT_DIR_B}:${CONTAINER_PROJECT_DIR_B:-/project-b}
      - ${HOME}/.claude-state/account-b:/home/node/.claude
      - ${HOME}/.claude:/home/node/.claude-host:ro
      - ${GH_CONFIG_DIR:-${HOME}/.config/gh}:/home/node/.config/gh:ro
      - node_modules_b:${CONTAINER_PROJECT_DIR_B:-/project-b}/node_modules
