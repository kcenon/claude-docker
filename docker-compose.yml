# docker-compose.yml — Base config (Tier A: shared source)
# Generated by scripts/generate-compose.sh — do not edit manually.
# Regenerate: scripts/generate-compose.sh

services:
  claude-a:
    build:
      context: .
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-}
    image: claude-code-base:${IMAGE_TAG:-2026.04.10}
    working_dir: ${CONTAINER_PROJECT_DIR:-/project}
    stdin_open: true
    tty: true
    volumes:
      - ${PROJECT_DIR}:${CONTAINER_PROJECT_DIR:-/project}
      - ${HOME}/.claude-state/account-a:/home/node/.claude
      - ${HOME}/.claude:/home/node/.claude-host:ro
      - ${GH_CONFIG_DIR:-${HOME}/.config/gh}:/home/node/.config/gh:ro
      - node_modules_a:${CONTAINER_PROJECT_DIR:-/project}/node_modules
    environment:
      - TERM=xterm-256color
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      - CLAUDE_CONFIG_SOURCE=${CLAUDE_CONFIG_SOURCE:-}
      - NODE_OPTIONS=--max-old-space-size=4096
      - ANTHROPIC_API_KEY=${CLAUDE_API_KEY_A:-}
      - GH_TOKEN=${GH_TOKEN:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
    command: ["sleep", "infinity"]

  claude-b:
    image: claude-code-base:${IMAGE_TAG:-2026.04.10}
    depends_on:
      - claude-a
    working_dir: ${CONTAINER_PROJECT_DIR:-/project}
    stdin_open: true
    tty: true
    volumes:
      - ${PROJECT_DIR}:${CONTAINER_PROJECT_DIR:-/project}
      - ${HOME}/.claude-state/account-b:/home/node/.claude
      - ${HOME}/.claude:/home/node/.claude-host:ro
      - ${GH_CONFIG_DIR:-${HOME}/.config/gh}:/home/node/.config/gh:ro
      - node_modules_b:${CONTAINER_PROJECT_DIR:-/project}/node_modules
    environment:
      - TERM=xterm-256color
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      - CLAUDE_CONFIG_SOURCE=${CLAUDE_CONFIG_SOURCE:-}
      - NODE_OPTIONS=--max-old-space-size=4096
      - ANTHROPIC_API_KEY=${CLAUDE_API_KEY_B:-}
      - GH_TOKEN=${GH_TOKEN:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
    command: ["sleep", "infinity"]

volumes:
  node_modules_a:
  node_modules_b:
