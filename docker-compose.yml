# docker-compose.yml — Base config (Tier A: shared source)
# Generated by scripts/generate-compose — do not edit manually.
# Regenerate: scripts/generate-compose.sh OR scripts/generate-compose.ps1

services:
  claude-a:
    build:
      context: .
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-}
    image: claude-code-base:${IMAGE_TAG:-2026.04.17}
    working_dir: ${CONTAINER_PROJECT_DIR:-/project}
    # Match the host user's UID/GID so bind-mounted paths
    # (${HOME}/.claude-state/account-*) stay writable from
    # inside the container. Falls back to 1000:1000 (the
    # upstream node:20-slim default) when UID/GID are unset.
    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true
    tty: true
    volumes:
      - ${PROJECT_DIR}:${CONTAINER_PROJECT_DIR:-/project}
      - ${HOME}/.claude-state/account-a:/home/node/.claude
      - ${HOME}/.claude:/home/node/.claude-host:ro
      - ${GH_CONFIG_DIR:-${HOME}/.config/gh}:/home/node/.config/gh:ro
      - node_modules_a:${CONTAINER_PROJECT_DIR:-/project}/node_modules
    environment:
      - TERM=xterm-256color
      - TZ=${TZ:-UTC}
      - HOME=/home/node
      - AGENT_RUNTIME=claude
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      - CLAUDE_CONFIG_SOURCE=${CLAUDE_CONFIG_SOURCE:-}
      - CLAUDE_NORMALIZE_CRLF=${CLAUDE_NORMALIZE_CRLF:-}
      - NODE_OPTIONS=--max-old-space-size=4096
      - GH_TOKEN=${GH_TOKEN:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
    command: ["sleep", "infinity"]

  claude-b:
    image: claude-code-base:${IMAGE_TAG:-2026.04.17}
    depends_on:
      - claude-a
    working_dir: ${CONTAINER_PROJECT_DIR:-/project}
    # Match the host user's UID/GID so bind-mounted paths
    # (${HOME}/.claude-state/account-*) stay writable from
    # inside the container. Falls back to 1000:1000 (the
    # upstream node:20-slim default) when UID/GID are unset.
    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true
    tty: true
    volumes:
      - ${PROJECT_DIR}:${CONTAINER_PROJECT_DIR:-/project}
      - ${HOME}/.claude-state/account-b:/home/node/.claude
      - ${HOME}/.claude:/home/node/.claude-host:ro
      - ${GH_CONFIG_DIR:-${HOME}/.config/gh}:/home/node/.config/gh:ro
      - node_modules_b:${CONTAINER_PROJECT_DIR:-/project}/node_modules
    environment:
      - TERM=xterm-256color
      - TZ=${TZ:-UTC}
      - HOME=/home/node
      - AGENT_RUNTIME=claude
      - CLAUDE_CONFIG_DIR=/home/node/.claude
      - CLAUDE_CONFIG_SOURCE=${CLAUDE_CONFIG_SOURCE:-}
      - CLAUDE_NORMALIZE_CRLF=${CLAUDE_NORMALIZE_CRLF:-}
      - NODE_OPTIONS=--max-old-space-size=4096
      - GH_TOKEN=${GH_TOKEN:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
    command: ["sleep", "infinity"]

volumes:
  node_modules_a:
  node_modules_b:
