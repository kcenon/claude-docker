name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ludeeus/action-shellcheck@master
        env:
          # SC1091: sourced files are resolved at runtime, not checkable in lint
          SHELLCHECK_OPTS: -e SC1091
        with:
          scandir: "./scripts"
          severity: warning

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  psanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Run analyzer
        shell: pwsh
        run: |
          # PSAvoidUsingWriteHost is waived globally: user-facing CLI scripts
          # (claude-docker.ps1, install.ps1, remove.ps1, cleanup.ps1, etc.) use
          # Write-Host for colored terminal output, which is load-bearing for
          # the CLI UX. Refactoring to a logging helper is out of scope for
          # the warning-threshold restoration.
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning `
            -ExcludeRule PSAvoidUsingWriteHost
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }

  go-test:
    name: Go tests (TUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          # Must match or exceed tui/go.mod's `go` directive (currently 1.23).
          go-version: "1.23"
      - name: Run Go unit tests
        working-directory: ./tui
        run: go test ./...

  compose-validate:
    name: Compose validate (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [minimal, tier-b, n5, n30, with-special-chars]
    steps:
      - uses: actions/checkout@v6
      - name: Stage fixture
        run: cp tests/env_fixtures/${{ matrix.fixture }}.env .env
      - name: Generate compose
        run: bash scripts/generate-compose.sh
      - name: Validate compose
        run: docker compose config > /dev/null
