name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # 2.0.0
        env:
          # SC1091: sourced files are resolved at runtime, not checkable in lint
          SHELLCHECK_OPTS: -e SC1091
        with:
          scandir: "./scripts"
          severity: warning

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5  # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  psanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
      - name: Run analyzer
        shell: pwsh
        run: |
          # PSSA rules waived for this repository, each for a specific reason:
          #
          # - PSAvoidUsingWriteHost: user-facing CLI scripts (claude-docker.ps1,
          #   install.ps1, remove.ps1, cleanup.ps1) rely on Write-Host for
          #   colored terminal output. Refactoring to a logging helper is a
          #   large behavior change outside the scope of restoring the gate.
          # - PSUseSingularNouns: several function names (e.g. Install-Worktrees,
          #   Remove-Accounts) are intentionally plural because they operate on
          #   the whole set. Renaming is a breaking change for anyone sourcing
          #   the module.
          # - PSUseShouldProcessForStateChangingFunctions: these are top-level
          #   CLI entry points, not library cmdlets; users invoke them
          #   imperatively and -WhatIf / -Confirm would add friction without
          #   a pipeline caller that passes them through.
          # - PSUseBOMForUnicodeEncodedFile: files are ASCII-safe / UTF-8
          #   without BOM, matching the rest of the repo and modern tooling.
          # - PSAvoidGlobalVars: index.ps1 uses $Global: to register the module
          #   at load time; that is the documented PowerShell pattern.
          # - PSReviewUnusedParameter: parameters exist for pass-through to
          #   wrapped cmdlets; removing them would break the contract.
          # - PSUseDeclaredVarsMoreThanAssignments: some assignments seed
          #   module-scope state consumed by callers outside the static
          #   analysis window.
          # - PSUseUsingScopeModifierInNewRunspaces: only test-concurrent-git.ps1
          #   spawns runspaces for concurrency stress, and the captured
          #   variables are intentional via closure.
          # - PSAvoidUsingEmptyCatchBlock: best-effort cleanup blocks
          #   deliberately swallow non-fatal errors to keep the CLI usable
          #   when optional steps fail.
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning `
            -ExcludeRule PSAvoidUsingWriteHost, PSUseSingularNouns, `
              PSUseShouldProcessForStateChangingFunctions, `
              PSUseBOMForUnicodeEncodedFile, PSAvoidGlobalVars, `
              PSReviewUnusedParameter, PSUseDeclaredVarsMoreThanAssignments, `
              PSUseUsingScopeModifierInNewRunspaces, `
              PSAvoidUsingEmptyCatchBlock
          if ($results) {
            $results | Format-Table -AutoSize
            exit 1
          }

  go-test:
    name: Go tests (TUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          # Must match or exceed tui/go.mod's `go` directive (currently 1.24).
          go-version: "1.24"
      - name: Run Go unit tests
        working-directory: ./tui
        run: go test ./...
      # `go test ./...` compiles benchmark functions but never executes them,
      # so a benchmark harness that panics at runtime stays green forever.
      # -benchtime=1x runs each benchmark exactly once: enough to catch that,
      # too few iterations for the timing to be a flaky gate. Results are not
      # asserted on here; the numbers of record live in docs/PERFORMANCE.md.
      - name: Smoke-run Go benchmarks
        working-directory: ./tui
        run: go test ./... -run '^$' -bench . -benchtime=1x
      # Formatting is checked here rather than in a separate job because the Go
      # toolchain is already provisioned. The job name stays "Go tests (TUI)"
      # so any branch-protection rule referencing it keeps matching; the step
      # name is what identifies a formatting failure.
      - name: Check gofmt
        working-directory: ./tui
        # `gofmt -l` lists offending files but still exits 0, so the emptiness
        # of its output is the assertion. Asserting on its exit status instead
        # would leave the gate permanently green (issue #305).
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt violations found. Fix with: gofmt -w <file>"
            printf '%s\n' "$unformatted"
            exit 1
          fi

  compose-validate:
    name: Compose validate (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [minimal, tier-b, n5, n30, with-special-chars, codex, gemini, github-per-account]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Stage fixture
        run: cp tests/env_fixtures/${{ matrix.fixture }}.env .env
      - name: Generate compose
        run: bash scripts/generate-compose.sh
      - name: Validate compose
        run: docker compose config > /dev/null

  # `compose-validate` above only ever inspects compose files it has just
  # generated from a fixture, so it cannot observe drift in the copies that are
  # actually committed. This job closes that gap: it regenerates in place and
  # asserts the working tree is unchanged.
  #
  # The committed compose files represent the generator's built-in defaults
  # with no `.env` present:
  #   NUM_ACCOUNTS=2       (scripts/generate-compose.sh default)
  #   AGENT_RUNTIME=claude (scripts/lib/runtime.sh default)
  #   ISOLATION_MODE=shared (scripts/lib/isolation.sh default)
  #   IMAGE_TAG            read from the repo-root VERSION file
  # A VERSION bump therefore requires regenerating the compose files in the
  # same change, because the committed files embed the tag as a default.
  #
  # The file list in "Assert no drift" is the tracked generated set. Every mode
  # generates all four, so the mode does not change what belongs here -- but a
  # stage that adds another generated stack must add it to that list too, or
  # the new file gets no drift coverage while the job stays green. That is not
  # hypothetical: docker-compose.isolated.yml was added in stage 3 of #335 and
  # would have been invisible here until it was listed.
  compose-freshness:
    name: Compose files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Regenerate from generator defaults
        # `.env` is gitignored and absent on a fresh checkout; removing it
        # anyway pins the job to the documented defaults rather than to
        # whatever a future change might leave in the working tree.
        run: |
          rm -f .env
          bash scripts/generate-compose.sh
      - name: Assert no drift
        run: |
          if ! git diff --exit-code -- docker-compose.yml docker-compose.linux.yml docker-compose.worktree.yml docker-compose.isolated.yml; then
            echo "::error::Committed compose files differ from generator output. Regenerate with: rm -f .env && bash scripts/generate-compose.sh"
            exit 1
          fi

  bash-tests:
    name: Bash Tests (${{ matrix.test }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - tests/test_ccstatusline_xdg_symlink.sh
          - tests/test_parse_env.sh
          - tests/test_parse_env_equivalence.sh
          - tests/test_runtime_registry_equivalence.sh
          - tests/test_compose_generator_equivalence.sh
          - tests/test_isolation_modes.sh
          - tests/test_container_memory.sh
          - tests/test_github_per_account_compose.sh
          - tests/test_github_account_selection.sh
          - tests/test_entrypoint_github_auth.sh
          - tests/test_installer_github_equivalence.sh
          - tests/test_num_accounts_precedence.sh
          - tests/test_agent_attach_argv.sh
          - tests/test_transform_syntax_check.sh
          - tests/test_cleanup_backups.sh
          - tests/test_windows_platform_guard.sh
          - scripts/test-entrypoint-settings.sh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Run ${{ matrix.test }}
        run: bash "${{ matrix.test }}"

  pwsh-tests:
    name: PowerShell Tests (${{ matrix.test }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - tests/test_parse_env.ps1
          - tests/test_isolation_modes.ps1
          - tests/test_container_memory.ps1
          - tests/test_powershell_platform_guard.ps1
          - tests/test_worktree_path_guard.ps1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Run ${{ matrix.test }}
        shell: pwsh
        run: pwsh -NoProfile -File "${{ matrix.test }}"

  pwsh-windows-tests:
    name: PowerShell Windows Tests (GitHub account selection)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Run GitHub account selection test
        shell: pwsh
        run: pwsh -NoProfile -File tests/test_github_account_selection.ps1

  # Live keyless smoke test for Epic #267 AC3 #1 and the keyless half of AC3 #2:
  # AGENT_RUNTIME=gemini + `claude-docker up` brings the gemini container to a
  # running state, and the service/binary pair that `claude-docker gemini`
  # resolves to actually runs inside it. This goes one step beyond
  # `compose-validate (gemini)` (static `docker compose config`) by building the
  # image, starting the container, asserting it is running, exercising the
  # attach target, and tearing it down. The gemini service command is
  # ["sleep", "infinity"], and neither the boot path nor `gemini --version`
  # references GEMINI_API_KEY, so this runs with no secret.
  #
  # A final, key-gated phase then covers the authenticated half of AC3 #2 when
  # a GEMINI_API_KEY secret exists (#301). It runs strictly *after* every
  # keyless assertion above, and only then introduces the key — so the AC3 #1
  # checks keep being made in an environment that has no credential at all,
  # which is the whole point of them. Without the secret (forks, Dependabot,
  # or before the owner configures one) that phase emits a notice and passes.
  #
  # Folded into this job rather than split into a second one so the heavy image
  # build happens once; a separate job would need a buildx layer cache to avoid
  # paying for it twice, which the `claude-docker up` build path does not
  # currently wire up.
  #
  # What stays manual after this job is the TUI screen check — accounts listed
  # and attached from the dashboard (#289). *Which* service and argv an attach
  # resolves to is pinned daemon-free by tests/test_agent_attach_argv.sh, and
  # the TUI's equivalent is covered by the Go tests in tui/internal/docker and
  # tui/internal/config (AC3 #3).
  #
  # Kept as a single, NUM_ACCOUNTS=1 dedicated job (not folded into the
  # compose-validate matrix) so the heavy image build runs once for one runtime
  # rather than per fixture.
  gemini-up-smoke:
    name: "Gemini up/down smoke (AC3 #1 + #2)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Stage gemini fixture (single account)
        run: |
          cp tests/env_fixtures/gemini.env .env
          # Narrow to one account so the image build + boot runs once for
          # gemini-a only. The caller env overrides the fixture's value.
          echo "NUM_ACCOUNTS=1" >> .env
      - name: Prepare host bind-mount directories
        run: |
          # The fixture sets HOME=/tmp/claude-test; create the per-account
          # state dir, the read-only host config mount, the gh config mount,
          # and the project dir so the keyless bind mounts resolve.
          mkdir -p /tmp/claude-test/.gemini-state/account-a \
                   /tmp/claude-test/.gemini-host \
                   /tmp/claude-test/.config/gh \
                   /tmp/claude-test/project
      - name: Generate compose
        run: NUM_ACCOUNTS=1 bash scripts/generate-compose.sh
      - name: Build image and bring up gemini-a (keyless)
        run: bash scripts/claude-docker up
      - name: Assert gemini-a is running
        run: |
          set -euo pipefail
          cid="$(bash scripts/claude-docker compose ps -q gemini-a)"
          if [[ -z "$cid" ]]; then
            echo "::error::gemini-a container was not created"
            bash scripts/claude-docker ps || true
            exit 1
          fi
          running="$(docker inspect -f '{{.State.Running}}' "$cid")"
          restarting="$(docker inspect -f '{{.State.Restarting}}' "$cid")"
          echo "gemini-a: Running=$running Restarting=$restarting"
          if [[ "$running" != "true" || "$restarting" != "false" ]]; then
            echo "::error::gemini-a is not in a stable running state"
            docker inspect -f '{{json .State}}' "$cid"
            bash scripts/claude-docker compose logs gemini-a || true
            exit 1
          fi
      - name: "Attach target runs inside the container (AC3 #2, keyless)"
        run: |
          set -euo pipefail
          # `claude-docker gemini` resolves to `docker compose exec gemini-a
          # gemini` — pinned without a daemon by tests/test_agent_attach_argv.sh.
          # Here that same service/binary pair is executed for real: -T because
          # the runner has no TTY, and `--version` because it is the one gemini
          # invocation that needs no credential. A wrong service name, a binary
          # missing from the image, or a PATH the runtime is not on all fail here
          # rather than in a user's first attach.
          version="$(bash scripts/claude-docker compose exec -T gemini-a gemini --version)"
          echo "gemini --version -> $version"
          if [[ -z "${version//[[:space:]]/}" ]]; then
            echo "::error::gemini --version produced no output in gemini-a"
            exit 1
          fi
      - name: "Authenticated round-trip when a key is available (AC3 #2)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          # The `secrets` context is not available in a job-level `if:`, so the
          # guard lives here: take the secret through env and no-op when empty.
          # Fork and Dependabot PRs are never given secrets, so they take this
          # path and pass rather than failing contributors who cannot supply a
          # key. The same applies before the owner configures one at all.
          if [[ -z "${GEMINI_API_KEY:-}" ]]; then
            echo "::notice::GEMINI_API_KEY not configured; skipping the authenticated gemini check"
            exit 0
          fi

          # Everything above ran with no credential in the environment -- that
          # is what makes the AC3 #1 assertions meaningful. The key enters only
          # now, through the per-account variable the compose generator reads
          # (it injects GEMINI_API_KEY into the service only for accounts whose
          # key is non-empty), so the container must be recreated to see it.
          echo "GEMINI_API_KEY_A=${GEMINI_API_KEY}" >> .env
          NUM_ACCOUNTS=1 bash scripts/generate-compose.sh
          bash scripts/claude-docker up

          # Gemini CLI switches to headless mode under -p (and in any non-TTY
          # environment such as this runner). --output-format json makes the
          # result parseable, so the assertion is on response shape rather than
          # on model wording, which would be brittle.
          rc=0
          out="$(bash scripts/claude-docker compose exec -T gemini-a \
                   gemini -p 'Reply with the single word OK.' \
                   --output-format json)" || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            # Documented headless exit codes: 1 general/API failure,
            # 42 input validation, 53 turn limit.
            echo "::error::authenticated gemini call exited with status $rc"
            printf '%s\n' "$out"
            exit 1
          fi

          # A successful headless run carries no .error and a non-empty
          # .response string.
          if ! printf '%s' "$out" \
               | jq -e '.error == null and (.response | type) == "string" and (.response | length) > 0' \
                 >/dev/null; then
            echo "::error::gemini returned no usable response"
            printf '%s\n' "$out"
            exit 1
          fi
          echo "authenticated gemini round-trip OK: $(printf '%s' "$out" | jq -r '.response' | head -c 80)"
      - name: Tear down
        if: always()
        run: bash scripts/claude-docker down -v --remove-orphans
